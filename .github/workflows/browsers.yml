name: browser-hash-matrix
on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:
jobs:
  hashes:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Replay-set in Chromium, Firefox en WebKit (actief vanaf sprint 2)
        run: pnpm --filter @crawlout/replay run replay:browsers
        continue-on-error: true
