<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Crawlout</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #111;
        color: #ddd;
        font-family: system-ui, sans-serif;
        overflow: hidden;
      }
      #stage {
        position: relative;
        height: 100%;
      }
      #view {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }
      #marquee {
        position: absolute;
        display: none;
        border: 1px solid #7dff7d;
        background: rgba(125, 255, 125, 0.12);
        pointer-events: none;
      }
      #perf {
        position: absolute;
        top: 0;
        left: 50%;
        width: 200px;
        height: 64px;
        transform: translateX(-50%);
        pointer-events: none;
      }
      #hud {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      #end {
        position: absolute;
        inset: 0;
        display: none;
        place-items: center;
        padding: 24px;
        text-align: center;
        font-size: 28px;
        background: rgba(10, 10, 12, 0.6);
      }
      #error {
        position: absolute;
        inset: 0;
        display: none;
        place-items: center;
        padding: 24px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <canvas id="view" aria-label="Crawlout: speelveld"></canvas>
      <div id="marquee"></div>
      <div id="hud"></div>
      <div id="perf"></div>
      <div id="end" role="status"></div>
      <div id="error" role="alert"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
