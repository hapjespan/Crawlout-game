<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <title>asset-cli gebouwenpreview</title>
    <style>
      html,
      body {
        margin: 0;
        background: #222a2e;
        overflow: hidden;
      }
      #info {
        position: absolute;
        left: 8px;
        top: 8px;
        color: #e8e2d6;
        font: 12px/1.4 monospace;
        white-space: pre;
        pointer-events: none;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "/node_modules/.pnpm/three@0.186.1/node_modules/three/build/three.module.js",
          "three/addons/": "/node_modules/.pnpm/three@0.186.1/node_modules/three/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <div id="info"></div>
    <script type="module">
      // Preview voor eigen controle (geen onderdeel van de buis): laadt gebouwen uit assets/dist (of een los GLB),
      // tekent de footprint met een raster van 1 m en kleurt team-materialen in een spelerskleur.
      // Query: manifest=<pad> lod=0|1|2 only=<id,id,...> prefix=<begin van de id, bijvoorbeeld site_> glb=<pad>
      //        debug=materials az=<graden> el=<graden> team=<hex> spacing=<m> cols=<aantal>
      // De site-gebouwen (site_*_ruin zonder teamkleur, site_*_restored met) staan in dezelfde lijst; footprint uit de data
      // of anders uit het manifest. `?prefix=site_&spacing=30` toont ze naast elkaar, ruine en hersteld per kolom.
      import * as THREE from 'three';
      import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
      import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';

      const q = new URLSearchParams(location.search);
      const lod = Number(q.get('lod') ?? 0);
      const az = (Number(q.get('az') ?? 35) * Math.PI) / 180;
      const el = (Number(q.get('el') ?? 38) * Math.PI) / 180;
      const teamColor = new THREE.Color(q.get('team') ?? '#d23b2a');
      const W = Number(q.get('w') ?? 1400);
      const H = Number(q.get('h') ?? 800);

      const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
      renderer.setSize(W, H);
      document.body.appendChild(renderer.domElement);
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x56604f);
      scene.add(new THREE.HemisphereLight(0xfff2dc, 0x4a4030, 1.7));
      const sun = new THREE.DirectionalLight(0xfff0d0, 2.4);
      sun.position.set(-6, 10, 5);
      scene.add(sun);

      const loader = new GLTFLoader().setMeshoptDecoder(MeshoptDecoder);
      const palette = [
        0xff0000, 0x00aa00, 0x3060ff, 0xffd000, 0xff00ff, 0x00cccc, 0xff8800, 0x8800ff, 0x888888,
      ];

      function prepare(gltf, debug) {
        let i = 0;
        const seen = new Map();
        gltf.scene.traverse((o) => {
          if (!o.isMesh) return;
          const m = o.material;
          if (debug) {
            if (!seen.has(m)) seen.set(m, palette[seen.size % palette.length]);
            o.material = new THREE.MeshBasicMaterial({ color: seen.get(m) });
            console.log('material', m.name, '->', '#' + seen.get(m).toString(16));
          } else if (/team/i.test(m.name)) {
            o.material = m.clone();
            o.material.color.copy(teamColor);
            o.material.map = null;
          }
          i++;
        });
      }

      function footprint(w, h) {
        const g = new THREE.Group();
        const pts = [];
        for (let x = -w / 2; x <= w / 2 + 1e-6; x += 1) pts.push(x, 0.01, -h / 2, x, 0.01, h / 2);
        for (let z = -h / 2; z <= h / 2 + 1e-6; z += 1) pts.push(-w / 2, 0.01, z, w / 2, 0.01, z);
        const geo = new THREE.BufferGeometry();
        geo.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3));
        g.add(
          new THREE.LineSegments(
            geo,
            new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.35 }),
          ),
        );
        const edge = new THREE.LineLoop(
          new THREE.BufferGeometry().setFromPoints([
            new THREE.Vector3(-w / 2, 0.02, -h / 2),
            new THREE.Vector3(w / 2, 0.02, -h / 2),
            new THREE.Vector3(w / 2, 0.02, h / 2),
            new THREE.Vector3(-w / 2, 0.02, h / 2),
          ]),
          new THREE.LineBasicMaterial({ color: 0xffff00 }),
        );
        g.add(edge);
        return g;
      }

      const items = [];
      if (q.get('glb')) {
        const fps = (q.get('fp') ?? '').split(',');
        q.get('glb')
          .split(',')
          .forEach((url, i) => {
            const [w, h] = (fps[i] ?? `${q.get('fw') ?? 0}x${q.get('fh') ?? 0}`)
              .split('x')
              .map(Number);
            items.push({ id: url, url, w, h });
          });
      } else {
        const base = q.get('manifest') ?? '/assets/dist/manifest.json';
        const manifest = await (await fetch(base)).json();
        const dir = base.slice(0, base.lastIndexOf('/') + 1);
        const footprints = await (await fetch('/data/buildings.json')).json();
        const bySlug = new Map(footprints.map((b) => [b.visuals.mesh, b.footprint]));
        for (const a of manifest.assets) {
          if (a.kind !== 'building') continue;
          if (q.get('only') && !q.get('only').split(',').includes(a.id)) continue;
          if (q.get('prefix') && !a.id.startsWith(q.get('prefix'))) continue;
          const f = bySlug.get(a.id) ?? a.footprint ?? { w: 0, h: 0 };
          items.push({
            id: a.id,
            url: dir + a.lods[lod].path,
            w: f.w,
            h: f.h,
            tris: a.lods[lod].triangles,
            bounds: a.bounds,
          });
        }
      }

      const cols = Number(q.get('cols') ?? (items.length === 1 ? 1 : Math.min(4, items.length)));
      const widest = Math.max(0, ...items.map((i) => Math.max(i.w, i.h)));
      const spacing = Number(q.get('spacing') ?? Math.max(9, widest + 2));
      const rows = Math.ceil(items.length / cols);
      const info = [];
      let idx = 0;
      for (const item of items) {
        const gltf = await loader.loadAsync(item.url);
        prepare(gltf, q.get('debug') === 'materials');
        const cx = ((idx % cols) - (cols - 1) / 2) * spacing;
        const cz = (Math.floor(idx / cols) - (rows - 1) / 2) * spacing;
        const root = new THREE.Group();
        root.position.set(cx, 0, cz);
        root.add(gltf.scene);
        if (item.w) root.add(footprint(item.w, item.h));
        if (q.get('ref') !== '0') {
          // Maatstaf: een bewoner van 1,8 m naast de footprint.
          const person = new THREE.Mesh(
            new THREE.CapsuleGeometry(0.22, 1.36, 4, 10),
            new THREE.MeshStandardMaterial({ color: 0x9fb4c4 }),
          );
          person.position.set(-(item.w || 2) / 2 - 0.6, 0.9, (item.h || 2) / 2 - 0.3);
          root.add(person);
        }
        scene.add(root);
        const box = new THREE.Box3().setFromObject(gltf.scene);
        info.push(
          `${item.id}${item.tris ? ' tris ' + item.tris : ''} bbox ${box.min.toArray().map((v) => v.toFixed(2))} .. ${box.max.toArray().map((v) => v.toFixed(2))}`,
        );
        idx++;
      }
      document.getElementById('info').textContent = info.join('\n');

      // Camera: kijk naar het midden van alles wat geladen is en pas de afstand aan op de bol eromheen.
      const camera = new THREE.PerspectiveCamera(28, W / H, 0.1, 400);
      const sphere = new THREE.Box3().setFromObject(scene).getBoundingSphere(new THREE.Sphere());
      const target = sphere.center.clone();
      const aspectFit = Math.max(1, 1 / Math.min(1, W / H));
      const dist =
        (sphere.radius / Math.sin((camera.fov * Math.PI) / 360)) *
        0.95 *
        (items.length === 1 ? 1 : 0.8) *
        aspectFit;
      camera.position.set(
        target.x + Math.sin(az) * Math.cos(el) * dist,
        target.y + Math.sin(el) * dist,
        target.z + Math.cos(az) * Math.cos(el) * dist,
      );
      camera.lookAt(target);
      renderer.render(scene, camera);
      document.title = 'ready';
      window.__ready = true;
    </script>
  </body>
</html>
